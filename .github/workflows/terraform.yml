name: Terraform CI/CD

on:
  push:
    branches: [main, awsliftandshift]
  pull_request:
    branches: [main, awsliftandshift]

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            eu-north-1
      TF_STATE_BUCKET:       terraform-state-file-999999
      TF_STATE_KEY:          terraform/terraform.tfstate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        working-directory: terraform-vprofile
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -reconfigure

      - name: Terraform Validate
        working-directory: terraform-vprofile
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform-vprofile
        id: plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform-vprofile/tfplan

      - name: Create human-readable plan
        working-directory: terraform-vprofile
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload text plan artefact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-text
          path: terraform-vprofile/tfplan.txt

      # Optional manual approval step (kept as-is if you use it)
      - name: Request Manual Approval
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'REQUEST_CHANGES',
              body: 'Please review the Terraform plan and approve the deployment.'
            });
            if (response.status !== 200) {
              core.setFailed('Failed to request approval');
            }

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform-vprofile
        run: terraform apply tfplan
        env:
          TF_INPUT: "0"